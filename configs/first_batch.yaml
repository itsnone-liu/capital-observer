# 首批验证资产名单（草案 v0.2 — 待 P0 报告定稿）
# 设计文档 sec.1: 首批验证 20–30 只ETF、50–100个主动权益组合、3–5个行业，争取两年以上历史。

indices:            # 大盘/成长/风格基准（新浪已验证全历史）
  market: [sh000300, sh000016, sh000905, sh000852, sh000912]   # 宽基: 300/50/500/1000/2000
  growth: [sz399006, sh000688]                                  # 成长: 创业板指/科创50
  sector_universe: sw_l1_all31                                  # 行业判定: 申万一级31个全量
  backup_upstreams: [baostock, eastmoney_clist]

etf_first_batch:    # 20-30只代表性ETF（份额历史fundf10季度+场内K线新浪全历史）
  broad:  [510300, 510050, 510500, 512100, 159915, 588000, 563300]   # 沪深300/上证50/中证500/中证1000/创业板/科创50/中证2000
  style:  [512100, 588000]                                            # （规模/成长风格代表，与上面重叠处合并）
  sector: [512480, 512760, 512690, 515790, 512800, 512010, 159928, 515030]  # 半导体/芯片/酒/光伏/银行/券商/消费/新能源车
  thematic: [510880(红利), 512880(证券), 513100(纳指-对照)]             # 标记: 跨境仅作对照不计入A股板块
  selection_rule: >
    覆盖>2亿份、上市>1年、跟踪误差正常；每个宽基/行业只留规模最大一只；
    数量目标 20-30，从 em_client.etf_list() 按规模筛选后人工定稿。

active_funds:       # 50-100 个主动权益（样本，非推荐）
  selection_rule: >
    从 fund_open_fund_rank_em 全量(约2万)中筛：
    ①普通股票型+偏股混合型（剔除指数/联接/QDII）②成立满3年 ③最新规模>2亿
    ④按公司分散：同一管理人≤5只 ⑤目标 50-100 只，覆盖 8-12 家基金公司。
  validation_targets: [005827, 000001, 110022]   # P0 已探测样本

industries:         # 3-5 个重点行业做穿透验证（申万一级）
  focus: [801080(电子), 801780(银行), 801150(食品饮料), 801880(汽车), 801160(医药)]
  note: 行业全景排名用全部31个；重点行业做持仓穿透与成本带。

history_target: ">= 2年（2024-09 至今硬性，争取 2023-08 起）"
gap_policy: "取不到的区间公开标记缺口，不插值不补零"
